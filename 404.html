<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — KopackaMk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Load theme colors from main stylesheet -->
  <link rel="stylesheet" href="/css/variables.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg, #FAFAF8);
      color: var(--text, #1A1A1A);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .icon {
      font-size: 8rem;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.1;
    }
    
    .subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary, #6B7280);
      margin-bottom: 2rem;
      font-weight: 400;
    }
    
    .message {
      font-size: 1rem;
      color: var(--text-secondary, #6B7280);
      margin-bottom: var(--spacing-xl, 3rem);
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      padding: 1rem 2.5rem;
      background: var(--accent, #2563EB);
      color: var(--white, #FFFFFF);
      text-decoration: none;
      border-radius: var(--radius-md, 12px);
      font-weight: 600;
      font-size: 1rem;
      transition: all var(--transition-base, 0.2s ease);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    
    .btn:hover {
      background: var(--accent-dark, #1E40AF);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .links {
      margin-top: var(--spacing-lg);
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .link {
      color: var(--text-secondary, #6B7280);
      text-decoration: none;
      font-size: 0.938rem;
      transition: color var(--transition-base, 0.2s ease);
      position: relative;
    }
    
    .link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent, #2563EB);
      transition: width var(--transition-base, 0.2s ease);
    }
    
    .link:hover {
      color: var(--accent, #2563EB);
    }
    
    .link:hover::after {
      width: 100%;
    }
    
    @media (max-width: 640px) {
      .icon {
        font-size: 5rem;
      }
      
      h1 {
        font-size: 2.5rem;
      }
      
      .subtitle {
        font-size: 1.125rem;
      }
      
      .message {
        font-size: 0.938rem;
      }
      
      .btn {
        padding: 0.875rem 2rem;
      }
    }
  </style>
  <script>
    // GitHub Pages SPA redirect
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="icon">👟</div>
    <h1>404</h1>
    <p class="subtitle">Page Not Found</p>
    <p class="message">
      Looks like this shoe has stepped out. 
      Let's get you back to browsing our collection.
    </p>
    <a href="/" class="btn">Back to Home</a>
    <div class="links">
      <a href="/collection" class="link">Browse Collection</a>
      <a href="/wishlist" class="link">View Wishlist</a>
    </div>
  </div>
</body>
</html>
